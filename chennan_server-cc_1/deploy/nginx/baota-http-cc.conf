# 城南 IM API：宝塔 Nginx 的 http{} 全局配置。
#
# 放置方法（二选一）：
# 1. 保存为 /www/server/nginx/conf/conf.d/chennan-cc.conf，并确认 nginx.conf
#    的 http{} 中 include 了该目录；
# 2. 直接粘贴到 /www/server/nginx/conf/nginx.conf 的 http{} 内。
#
# 注意：这些指令不能放进 server{} 或 location{}，否则 nginx -t 会失败。

# 固定 key 可让多个 API 域名共享同一个全局额度，避免攻击者轮换域名放大额度。
map $host $chennan_global_key {
    default "chennan_api";
}

# 429、带 Retry-After 的保护性 503、以及腾讯回调认证 401 已由 Go
# 采样日志和 ESA 实时日志记录。普通 503 仍保留，避免吞掉真实业务故障。
map "$uri:$status:$sent_http_retry_after" $chennan_access_loggable {
    default 1;
    ~^/api/v1/webhook/tencent:401:$ 0;
    ~:429:[^:]*$ 0;
    ~:503:[^:]+$ 0;
}

limit_req_zone $binary_remote_addr zone=chennan_native_login_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chennan_web_login_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chennan_api_ip:20m rate=60r/s;
limit_req_zone $binary_remote_addr zone=chennan_sensitive_ip:20m rate=20r/m;
limit_req_zone $binary_remote_addr zone=chennan_user_totp_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chennan_challenge_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=chennan_challenge_status_ip:10m rate=180r/m;
limit_req_zone $binary_remote_addr zone=chennan_refresh_ip:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=chennan_logout_ip:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=chennan_admin_login_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=chennan_admin_totp_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=chennan_download_ip:20m rate=120r/m;

limit_req_zone $chennan_global_key zone=chennan_native_login_total:1m rate=15r/s;
limit_req_zone $chennan_global_key zone=chennan_web_login_total:1m rate=15r/s;
limit_req_zone $chennan_global_key zone=chennan_login_shared_total:1m rate=25r/s;
limit_req_zone $chennan_global_key zone=chennan_api_total:1m rate=300r/s;
limit_req_zone $chennan_global_key zone=chennan_register_total:1m rate=5r/s;
limit_req_zone $chennan_global_key zone=chennan_sms_total:1m rate=3r/s;
limit_req_zone $chennan_global_key zone=chennan_reset_total:1m rate=3r/s;
limit_req_zone $chennan_global_key zone=chennan_user_totp_total:1m rate=10r/s;
limit_req_zone $chennan_global_key zone=chennan_challenge_total:1m rate=20r/s;
limit_req_zone $chennan_global_key zone=chennan_verify_shared_total:1m rate=25r/s;
limit_req_zone $chennan_global_key zone=chennan_challenge_status_total:1m rate=100r/s;
limit_req_zone $chennan_global_key zone=chennan_refresh_total:1m rate=100r/s;
limit_req_zone $chennan_global_key zone=chennan_logout_total:1m rate=100r/s;
limit_req_zone $chennan_global_key zone=chennan_refresh_shared_total:1m rate=150r/s;
limit_req_zone $chennan_global_key zone=chennan_admin_login_total:1m rate=2r/s;
limit_req_zone $chennan_global_key zone=chennan_admin_totp_total:1m rate=2r/s;
limit_req_zone $chennan_global_key zone=chennan_admin_shared_total:1m rate=4r/s;
limit_req_zone $chennan_global_key zone=chennan_bootstrap_total:1m rate=100r/s;
limit_req_zone $chennan_global_key zone=chennan_webhook_total:1m rate=200r/s;
limit_req_zone $chennan_global_key zone=chennan_download_total:1m rate=100r/s;

limit_conn_zone $binary_remote_addr zone=chennan_conn_ip:20m;

upstream chennan_go {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

log_format chennan_cc '$time_iso8601 client=$remote_addr edge=$realip_remote_addr '
                      'host=$host method=$request_method status=$status '
                      'rt=$request_time urt=$upstream_response_time bytes=$body_bytes_sent '
                      'req_bytes=$request_length';
