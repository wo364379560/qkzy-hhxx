# 城南 IM API：粘贴到宝塔中该 API 域名现有的 server{} 内。
# 保留宝塔原来的 listen/server_name/SSL 证书配置。
# 本文件中的两个正则 location 要放在已有的宽泛正则 location 之前；
# Nginx 同层正则按出现顺序匹配。
#
# 必须把下面占位符替换为 ESA 控制台“安全防护 -> 源站防护”的全部当前回源 CIDR；
# 占位符故意不可用，避免忘记配置真实 IP 信任链后带病上线。
set_real_ip_from __REPLACE_WITH_ESA_CIDR_1__;
# set_real_ip_from __REPLACE_WITH_ESA_CIDR_2__;
# ...每个 IPv4/IPv6 CIDR 一行，不能信任 0.0.0.0/0 或整个私网。
real_ip_header True-Client-IP-OUT;
real_ip_recursive off;

limit_req_status 429;
limit_req_log_level notice;
limit_conn_status 429;
limit_conn_log_level notice;
limit_conn chennan_conn_ip 30;

# server{} 级基线保护未单独列出的 API、ping 和随机 404。下方高危
# location 定义自己的 limit_req 后，会使用更严格的专用规则。
limit_req zone=chennan_api_ip burst=120 nodelay;
limit_req zone=chennan_api_total burst=300 nodelay;

client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 30s;
reset_timedout_connection on;

# 用这一行替换宝塔为该 API server 生成的原 access_log；不要保留两条，
# 否则旧日志仍会把每个 429/保护性 503 写入磁盘。
access_log /www/wwwlogs/chennan_cc.log chennan_cc buffer=256k flush=1s if=$chennan_access_loggable;

location = /api/v1/chat/login {
    limit_req zone=chennan_api_total burst=300 nodelay;
    # 用户登录不按 IP 限频；保留以下全站/接口容量限制。
    limit_req zone=chennan_native_login_total burst=10 nodelay;
    limit_req zone=chennan_login_shared_total burst=15 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/web-login {
    limit_req zone=chennan_api_total burst=300 nodelay;
    # Web 登录同样不按 IP 限频。
    limit_req zone=chennan_web_login_total burst=10 nodelay;
    limit_req zone=chennan_login_shared_total burst=15 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/register {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_sensitive_ip burst=3 nodelay;
    limit_req zone=chennan_register_total burst=5 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/sms/send {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_sensitive_ip burst=2 nodelay;
    limit_req zone=chennan_sms_total burst=3 nodelay;
    client_max_body_size 8k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/password/reset {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_sensitive_ip burst=3 nodelay;
    limit_req zone=chennan_reset_total burst=3 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/auth/refresh {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_refresh_ip burst=30 nodelay;
    limit_req zone=chennan_refresh_total burst=50 nodelay;
    limit_req zone=chennan_refresh_shared_total burst=75 nodelay;
    client_max_body_size 32k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/logout {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_logout_ip burst=10 nodelay;
    limit_req zone=chennan_logout_total burst=20 nodelay;
    limit_req zone=chennan_refresh_shared_total burst=75 nodelay;
    client_max_body_size 8k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/totp/verify {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_user_totp_ip burst=5 nodelay;
    limit_req zone=chennan_user_totp_total burst=10 nodelay;
    limit_req zone=chennan_verify_shared_total burst=15 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/chat/totp/setup-verify {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_user_totp_ip burst=5 nodelay;
    limit_req zone=chennan_user_totp_total burst=10 nodelay;
    limit_req zone=chennan_verify_shared_total burst=15 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location ~ ^/api/v1/chat/login-challenges/[^/]+/(verify-sms|exchange)$ {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_challenge_ip burst=10 nodelay;
    limit_req zone=chennan_challenge_total burst=20 nodelay;
    limit_req zone=chennan_verify_shared_total burst=15 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location ~ ^/api/v1/chat/login-challenges/(?!pending$)[^/]+$ {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_challenge_status_ip burst=30 nodelay;
    limit_req zone=chennan_challenge_status_total burst=50 nodelay;
    client_max_body_size 1k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/admin/login {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_admin_login_ip burst=2 nodelay;
    limit_req zone=chennan_admin_login_total burst=2 nodelay;
    limit_req zone=chennan_admin_shared_total burst=3 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/admin/totp/bind {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_admin_totp_ip burst=2 nodelay;
    limit_req zone=chennan_admin_totp_total burst=2 nodelay;
    limit_req zone=chennan_admin_shared_total burst=3 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/admin/totp/verify {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_admin_totp_ip burst=2 nodelay;
    limit_req zone=chennan_admin_totp_total burst=2 nodelay;
    limit_req zone=chennan_admin_shared_total burst=3 nodelay;
    client_max_body_size 16k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/public/bootstrap/domain-pool {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_bootstrap_total burst=50 nodelay;
    client_max_body_size 1k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location ~ ^/api/v1/chat/files/[^/]+/download$ {
    limit_req zone=chennan_api_total burst=300 nodelay;
    limit_req zone=chennan_download_ip burst=20 nodelay;
    limit_req zone=chennan_download_total burst=50 nodelay;
    client_max_body_size 1k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

location = /api/v1/webhook/tencent {
    limit_req zone=chennan_api_total burst=300 nodelay;
    # 腾讯回调可能共用出口 IP，因此这里只使用跨域名全局上限，不加每 IP 上限。
    limit_req zone=chennan_webhook_total burst=100 nodelay;
    client_max_body_size 256k;
    include /www/server/nginx/conf/chennan_proxy_common.conf;
}

# 若宝塔已有 location /，请把其中的 proxy_set_header 全部替换为 common 文件的写法；
# 不要同时保留两个 location /。若没有，可使用下面这段：
# location / {
#     client_max_body_size 20m;
#     include /www/server/nginx/conf/chennan_proxy_common.conf;
# }
