# 保存为 /www/server/nginx/conf/chennan_proxy_common.conf。
# 本文件只允许在 location{} 内 include。

proxy_pass http://chennan_go;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# 公网 API 只允许 HTTPS；固定外部协议可避免 ESA 以 HTTP 回源时生成
# http:// 下载链接。两个头都由 Nginx 覆盖，不能沿用客户端伪造值。
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

# $remote_addr 已由 ngx_http_realip_module 校验并替换为真实客户端 IP。
# 必须覆盖，禁止使用 $proxy_add_x_forwarded_for。
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

# 不把外部供应商头继续传给 Go，Go 只信任本机 Nginx 写入的 X-Real-IP。
proxy_set_header True-Client-IP-OUT "";
proxy_set_header True-Client-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header Ali-Real-Client-IP "";
proxy_set_header Ali-Cdn-Real-Ip "";

proxy_connect_timeout 2s;
proxy_send_timeout 10s;
# 后台 CSV 导出和批量 IM 操作可能超过 30 秒。公开认证接口由
# limit_req、请求体上限和 Go 并发保险丝保护，不依赖此全局超时抗 CC。
proxy_read_timeout 120s;
proxy_request_buffering on;
proxy_buffering on;
proxy_next_upstream off;
