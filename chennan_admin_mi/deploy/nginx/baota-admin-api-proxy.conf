# 管理后台站点（https://rzh35ht.ruizhihe.com）宝塔 server{} 内粘贴。
# 与 location / 同级；^~ 防止 API 被静态文件正则 location 截获。
# 可选：仅当显式构建为同域 /api 时启用；默认生产包直接访问 CF API。
# 浏览器访问管理站同域 /api 时，由 Nginx 反代到 CF API，
# 避免浏览器向 API 域名发送跨域预检。

location ^~ /api/ {
    proxy_pass https://api.ruizhihe.com;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.ruizhihe.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host api.ruizhihe.com;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
}
